name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # The same command the README tells readers to run. No secret is available here on
      # purpose: the job proves the bot degrades to fixture findings instead of failing.
      - name: Offline demo without an API key
        run: dotnet run --project src/ClaudeReviewBot -c Release --no-build -- --patch samples/sample.patch --dry-run
        env:
          ANTHROPIC_API_KEY: ""
