# Copy this file to .github/workflows/claude-review.yml in the repository you want reviewed,
# then add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions.
name: Claude review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# The bot needs to write reviews and nothing else.
permissions:
  contents: read
  pull-requests: write

# A new push cancels the review of the previous commit instead of racing it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout. The diff and any file Claude asks for come from the GitHub API at
      # the pull request's head SHA, so untrusted code never touches the job that holds the key.
      - uses: Juxn89/claude-pr-review-bot@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-sonnet-5
          # max-findings: "10"
          # ignore-globs: "docs/**, *.snap"
          # project-context: >-
          #   Orders API on .NET 10. DTOs are records. We never catch Exception without rethrowing.
